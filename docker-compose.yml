services:
  postgres:
    image: postgres:16.15
    environment:
      # Local development credentials only; never reuse outside this stack.
      POSTGRES_DB: rostersync
      POSTGRES_USER: rostersync
      POSTGRES_PASSWORD: rostersync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostersync -d rostersync"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    # Kafka-compatible broker in a single container.
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      # Containers on the compose network use redpanda:9092; the Mac uses localhost:19092.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redpandadata:
