global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The app container started by docker compose. To watch an app started on the Mac
  # instead (./mvnw spring-boot:run, with the app container stopped), use the target
  # host.docker.internal:8080.
  - job_name: hr-roster-sync
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
