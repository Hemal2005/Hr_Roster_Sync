global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hr-roster-sync
    metrics_path: /actuator/prometheus
    static_configs:
      # The app running on the Mac (./mvnw spring-boot:run), seen from inside Docker.
      - targets: ["host.docker.internal:8080"]
