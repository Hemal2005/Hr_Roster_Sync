# Unit tests for alerts.yml: scripts/check-alerts.sh runs them with promtool.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: first brake trip of a tenant pages, then resolves after 15 minutes
    interval: 1m
    input_series:
      - series: 'reconciliation_brake_tripped_total{tenant="acme",reason="FILE_TRUNCATED"}'
        values: '_ _ _ 1x30'
    alert_rule_test:
      - eval_time: 2m
        alertname: ReconciliationBrakeTripped
        exp_alerts: []
      - eval_time: 5m
        alertname: ReconciliationBrakeTripped
        exp_alerts:
          - exp_labels:
              severity: page
              tenant: acme
              reason: FILE_TRUNCATED
            exp_annotations:
              summary: "Nightly reconciliation for acme is waiting for an operator (FILE_TRUNCATED)"
              action: "Nobody was deactivated. Check the run (GET /api/v1/reconciliations/{id}) and approve or reject it."
      - eval_time: 25m
        alertname: ReconciliationBrakeTripped
        exp_alerts: []

  - name: a later trip for the same tenant pages again
    interval: 1m
    input_series:
      - series: 'reconciliation_brake_tripped_total{tenant="acme",reason="MISSING_RATIO_EXCEEDED"}'
        values: '1x30 2x10'
    alert_rule_test:
      - eval_time: 25m
        alertname: ReconciliationBrakeTripped
        exp_alerts: []
      - eval_time: 33m
        alertname: ReconciliationBrakeTripped
        exp_alerts:
          - exp_labels:
              severity: page
              tenant: acme
              reason: MISSING_RATIO_EXCEEDED
            exp_annotations:
              summary: "Nightly reconciliation for acme is waiting for an operator (MISSING_RATIO_EXCEEDED)"
              action: "Nobody was deactivated. Check the run (GET /api/v1/reconciliations/{id}) and approve or reject it."

  - name: outbox stuck for more than a minute pages
    interval: 1m
    input_series:
      - series: 'outbox_oldest_age_seconds{application="hr-roster-sync"}'
        values: '0 0 30 90 150 210 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: OutboxNotDraining
        exp_alerts: []
      - eval_time: 5m
        alertname: OutboxNotDraining
        exp_alerts:
          - exp_labels:
              severity: page
              application: hr-roster-sync
            exp_annotations:
              summary: "Oldest unsent change event is 3m 30s old"
              action: "Check the broker and outbox.last_error_code; ingest keeps working meanwhile."
      - eval_time: 6m
        alertname: OutboxNotDraining
        exp_alerts: []

  - name: a third of records rejected for ten minutes opens a ticket
    interval: 1m
    input_series:
      - series: 'hr_events_total{tenant="acme",outcome="APPLIED",code="NONE"}'
        values: '0+60x40'
      - series: 'hr_events_total{tenant="acme",outcome="REJECTED",code="INVALID_PHONE"}'
        values: '0+30x40'
      - series: 'hr_events_total{tenant="globex",outcome="APPLIED",code="NONE"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: HrRejectionSpike
        exp_alerts:
          - exp_labels:
              severity: ticket
              tenant: acme
            exp_annotations:
              summary: "acme: 33.33% of HR records rejected"
              action: "See hr_events_total by code; usually a changed field format or a missing office code at the client."

  - name: one rejection in a quiet hour is not a spike
    interval: 1m
    input_series:
      - series: 'hr_events_total{tenant="acme",outcome="APPLIED",code="NONE"}'
        values: '0x40'
      - series: 'hr_events_total{tenant="acme",outcome="REJECTED",code="INVALID_PHONE"}'
        values: '0x20 1x20'
    alert_rule_test:
      - eval_time: 35m
        alertname: HrRejectionSpike
        exp_alerts: []

  # Bucket bounds are the ones the app publishes (MetricsIT checks the 3600 s bucket):
  # with the default 30 s top bucket this alert could never fire.
  - name: events arriving about 7 minutes late for 15 minutes open a ticket
    interval: 1m
    input_series:
      - series: 'hr_ingest_lag_seconds_bucket{tenant="acme",le="274.877906944"}'
        values: '0x40'
      - series: 'hr_ingest_lag_seconds_bucket{tenant="acme",le="366.503875925"}'
        values: '0x40'
      - series: 'hr_ingest_lag_seconds_bucket{tenant="acme",le="458.129844906"}'
        values: '0+60x40'
      - series: 'hr_ingest_lag_seconds_bucket{tenant="acme",le="3600.0"}'
        values: '0+60x40'
      - series: 'hr_ingest_lag_seconds_bucket{tenant="acme",le="+Inf"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: HrIngestLagHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: HrIngestLagHigh
        exp_alerts:
          - exp_labels:
              severity: ticket
              tenant: acme
            exp_annotations:
              summary: "acme: p99 HR event lag is 7m 37s"
              action: "Changes reach us late; check the client's HR integration and our ingest latency."

  - name: events arriving within seconds do not open a ticket
    interval: 1m
    input_series:
      - series: 'hr_ingest_lag_seconds_bucket{tenant="acme",le="1.0"}'
        values: '0+60x40'
      - series: 'hr_ingest_lag_seconds_bucket{tenant="acme",le="3600.0"}'
        values: '0+60x40'
      - series: 'hr_ingest_lag_seconds_bucket{tenant="acme",le="+Inf"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: HrIngestLagHigh
        exp_alerts: []

  # The dashboard's "Brake trips (24 h)" query. A series created within the window counts
  # in full (increase() would miss its first trip); an older one counts what it grew.
  - name: brake trips panel counts first trips and later trips over 24 hours
    interval: 1h
    input_series:
      - series: 'reconciliation_brake_tripped_total{tenant="acme",reason="MISSING_RATIO_EXCEEDED"}'
        values: '1x25 3x5'
      - series: 'reconciliation_brake_tripped_total{tenant="acme",reason="FILE_TRUNCATED"}'
        values: '_x26 1x4'
    promql_expr_test:
      - expr: round((sum(increase(reconciliation_brake_tripped_total[24h]) and reconciliation_brake_tripped_total offset 24h) or vector(0)) + (sum(reconciliation_brake_tripped_total unless reconciliation_brake_tripped_total offset 24h) or vector(0)))
        eval_time: 28h
        exp_samples:
          - labels: '{}'
            value: 3

  - name: brake trips panel shows 0, not "no data", when nothing ever tripped
    interval: 1m
    input_series:
      - series: 'outbox_depth{application="hr-roster-sync"}'
        values: '0x10'
    promql_expr_test:
      - expr: round((sum(increase(reconciliation_brake_tripped_total[24h]) and reconciliation_brake_tripped_total offset 24h) or vector(0)) + (sum(reconciliation_brake_tripped_total unless reconciliation_brake_tripped_total offset 24h) or vector(0)))
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0
