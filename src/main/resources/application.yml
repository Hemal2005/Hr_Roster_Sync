spring:
  application:
    name: hr-roster-sync
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rostersync}
    username: ${DB_USER:rostersync}
    password: ${DB_PASSWORD:rostersync}
  jpa:
    # Requests must not hold a database connection while rendering a response.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that its mapping matches.
      ddl-auto: validate
  servlet:
    multipart:
      # A 200,000-row export is roughly 25 MB.
      max-file-size: 100MB
      max-request-size: 100MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      # Wait for all in-sync replicas, and let the broker drop retried duplicates.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        # Only these; env, beans, heapdump and the rest stay closed.
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: hr-roster-sync

rostersync:
  reconciliation:
    # Share of active employees an export may miss before the run waits for an operator.
    brake-threshold: 0.30
    bucket-count: 64
  outbox:
    topic: rostersync.employee-changes
    batch-size: 100
    poll-interval-ms: 200
    max-backoff-ms: 10000

logging:
  structured:
    # One JSON object per line; MDC values (traceId, tenantId, employeeId) become fields.
    format:
      console: logstash
